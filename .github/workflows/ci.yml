name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  cek:
    name: Lint, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` dipakai, bukan `npm install`, supaya versi dependensi persis
      # mengikuti package-lock.json dan hasil CI bisa diulang.
      - run: npm ci

      - run: npm run lint
      - run: npm test
      - run: npm run build
